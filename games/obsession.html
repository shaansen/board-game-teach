<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsession, one point at a time</title>
<meta name="description" content="A briefing that teaches Obsession in twenty-two points, for someone who has never opened the box.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,800&family=Karla:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #0E1A14;
    --wall:     #17281F;
    --wall-lit: #1E332A;
    --brass:    #C39A4E;
    --brass-hi: #EBD196;
    --oxblood:  #8A342C;
    --ivory:    #F1E9D8;
    --ivory-2:  #E3D8C0;
    --dim:      #9AA79C;
    --rule:     rgba(195,154,78,.28);
    --display:  "Bodoni Moda", "Didot", Georgia, serif;
    --body:     "Karla", "Helvetica Neue", system-ui, sans-serif;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--wall-lit) 0%, var(--wall) 45%, var(--ink) 100%);
    color:var(--ivory);
    font-family:var(--body);
    font-weight:300;
    line-height:1.6;
    min-height:100vh;
    padding:0 20px 64px;
  }

  /* faint damask texture, purely atmospheric */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(195,154,78,.035) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(195,154,78,.035) 0 1px, transparent 1px 22px);
  }

  .shell{max-width:820px;margin:0 auto;position:relative;z-index:1}

  /* ── back to the shelf ────────────────────── */
  .backlink{
    display:inline-block;margin:26px 0 0;
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .backlink:hover{color:var(--brass-hi);border-bottom-color:var(--brass)}

  /* ── masthead ─────────────────────────────── */
  header{padding:44px 0 26px;text-align:center}

  .eyebrow{
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--brass);font-weight:500;margin:0 0 18px;
  }

  h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(46px,12vw,92px);
    line-height:.92;
    margin:0;
    color:var(--ivory);
    letter-spacing:-.01em;
  }
  h1 em{
    display:block;font-style:italic;font-weight:400;
    font-size:clamp(15px,3.6vw,23px);
    letter-spacing:.02em;color:var(--brass-hi);margin-top:14px;
  }

  .sub{
    color:var(--dim);font-size:14px;margin:16px auto 0;max-width:44ch;
  }

  /* ── the bell board (signature) ───────────── */
  .board{
    margin:34px 0 10px;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    background:linear-gradient(180deg, rgba(195,154,78,.07), rgba(0,0,0,.18));
    padding:14px 0 10px;
  }
  .board-label{
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--brass);opacity:.75;text-align:center;margin:0 0 12px;
  }
  .rail{
    display:flex;gap:2px;overflow-x:auto;padding:0 14px 10px;
    scrollbar-width:thin;scrollbar-color:var(--brass) transparent;
  }
  .rail::-webkit-scrollbar{height:4px}
  .rail::-webkit-scrollbar-thumb{background:var(--brass);border-radius:4px}

  .bell{
    flex:0 0 auto;width:62px;background:none;border:0;cursor:pointer;
    padding:6px 2px 4px;color:var(--dim);font-family:var(--body);
    display:flex;flex-direction:column;align-items:center;gap:5px;
    border-radius:5px;transition:color .2s;
  }
  .bell svg{width:19px;height:19px;fill:currentColor;transform-origin:50% 12%;transition:transform .2s}
  .bell span{
    font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
    line-height:1.25;text-align:center;
  }
  .bell:hover{color:var(--ivory-2)}
  .bell:hover svg{transform:rotate(-9deg)}
  .bell.done{color:rgba(195,154,78,.62)}
  .bell.on{color:var(--brass-hi)}
  .bell.on svg{animation:ring .75s ease-out}
  .bell:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

  @keyframes ring{
    0%{transform:rotate(0)}   15%{transform:rotate(-15deg)}
    35%{transform:rotate(12deg)} 55%{transform:rotate(-8deg)}
    75%{transform:rotate(5deg)}  100%{transform:rotate(0)}
  }

  /* ── the card ─────────────────────────────── */
  .card{
    background:var(--ivory);
    color:#20180F;
    border-radius:2px;
    padding:38px 34px 34px;
    margin-top:26px;
    box-shadow:0 26px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(195,154,78,.35);
    position:relative;
  }
  .card::after{
    content:"";position:absolute;inset:9px;border:1px solid rgba(138,52,44,.2);
    pointer-events:none;border-radius:1px;
  }
  .card.turning{animation:deal .34s ease-out}
  @keyframes deal{
    from{opacity:0;transform:translateY(9px) rotate(-.25deg)}
    to{opacity:1;transform:none}
  }

  .meta{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:14px;border-bottom:1px solid rgba(32,24,15,.16);
    padding-bottom:11px;margin-bottom:22px;
  }
  .count{
    font-family:var(--display);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:#8A342C;font-weight:600;
  }
  .tag{
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;
    color:#6A6152;font-weight:500;
  }

  h2{
    font-family:var(--display);font-weight:600;
    font-size:clamp(27px,6.2vw,40px);line-height:1.08;
    margin:0 0 16px;letter-spacing:-.015em;
  }

  .card p{margin:0 0 15px;font-size:16.5px;color:#2E251A}
  .card p:last-child{margin-bottom:0}
  .card b{font-weight:700;color:#12100B}
  .card .hl{
    background:linear-gradient(transparent 62%, rgba(195,154,78,.42) 62%);
    font-weight:500;
  }

  ul.pts{list-style:none;padding:0;margin:0 0 15px}
  ul.pts li{
    position:relative;padding-left:22px;margin-bottom:9px;font-size:15.5px;color:#2E251A;
  }
  ul.pts li::before{
    content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;
    background:#8A342C;transform:rotate(45deg);
  }

  .aside{
    margin:22px 0 0;padding:15px 17px;
    background:rgba(138,52,44,.06);
    border-left:3px solid #8A342C;
  }
  .aside .lab{
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;
    color:#8A342C;font-weight:700;display:block;margin-bottom:6px;
  }
  .aside p{font-size:15px;margin:0;color:#2E251A}

  /* small inline diagram */
  .flow{
    display:flex;align-items:stretch;gap:0;margin:20px 0;flex-wrap:wrap;
    border:1px solid rgba(32,24,15,.18);
  }
  .flow div{
    flex:1 1 120px;padding:12px 10px;text-align:center;
    border-right:1px solid rgba(32,24,15,.18);
  }
  .flow div:last-child{border-right:0}
  .flow strong{
    display:block;font-family:var(--display);font-size:14.5px;font-weight:600;
    margin-bottom:3px;color:#12100B;
  }
  .flow small{font-size:11.5px;color:#6A6152;line-height:1.35;display:block}

  /* ── diagrams ─────────────────────────────── */
  figure.fig{margin:24px 0 20px;padding:0}
  figure.fig svg{width:100%;height:auto;display:block}
  figure.fig figcaption{
    font-family:var(--display);font-style:italic;font-size:13.5px;
    color:#6A6152;text-align:center;margin-top:10px;
  }
  .fig .lab{font-family:var(--body);font-size:13.5px;font-weight:400;fill:#6A6152}
  .fig .lab .k{fill:#8A342C;font-weight:700}
  .fig .lead{stroke:#8A342C;stroke-width:1.1;opacity:.5;fill:none}
  .fig .cap{font-family:var(--body);font-size:10.5px;letter-spacing:.16em;fill:#6A6152}
  .fig .num{font-family:"Bodoni Moda",Georgia,serif;font-weight:700}

  table.sc{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px}
  table.sc th,table.sc td{
    border:1px solid rgba(32,24,15,.18);padding:7px 6px;text-align:center;
  }
  table.sc th{background:rgba(138,52,44,.08);font-weight:700;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;color:#8A342C}

  /* ── controls ─────────────────────────────── */
  .controls{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;margin-top:24px;
  }
  button.nav{
    font-family:var(--body);font-size:12px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;
    padding:13px 22px;cursor:pointer;
    background:transparent;color:var(--brass-hi);
    border:1px solid var(--brass);border-radius:2px;
    transition:background .18s,color .18s;
  }
  button.nav:hover:not(:disabled){background:var(--brass);color:var(--ink)}
  button.nav:disabled{opacity:.26;cursor:not-allowed}
  button.nav:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
  button.nav.primary{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  button.nav.primary:hover{background:var(--brass-hi);border-color:var(--brass-hi)}

  .track{flex:1;height:1px;background:var(--rule);position:relative}
  .track i{
    position:absolute;left:0;top:-1px;height:3px;background:var(--brass);
    transition:width .34s ease;
  }

  .foot{
    text-align:center;color:var(--dim);font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;margin-top:26px;
  }
  .foot kbd{
    font-family:var(--body);background:rgba(195,154,78,.14);
    border:1px solid var(--rule);border-radius:2px;padding:1px 6px;
    font-size:10px;color:var(--brass-hi);
  }
  .foot a{color:var(--brass-hi);text-decoration:none;border-bottom:1px solid var(--rule)}

  @media (max-width:560px){
    .card{padding:28px 20px 26px}
    .card::after{inset:6px}
    .controls{flex-wrap:wrap}
    .track{order:3;flex:1 0 100%;margin-top:4px}
    button.nav{flex:1;padding:13px 12px;text-align:center}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="shell">

  <a class="backlink" href="../">&larr; the shelf</a>

  <header>
    <p class="eyebrow">Derbyshire &middot; Alderley Hall &middot; A Rules Apprenticeship</p>
    <h1>Obsession<em>The whole game, one bell at a time</em></h1>
    <p class="sub">Twenty-two points. Ring them in order the first time through, then poke around however you like.</p>
  </header>

  <div class="board">
    <p class="board-label">Servants&rsquo; Bell Board</p>
    <div class="rail" id="rail" role="tablist" aria-label="Lesson points"></div>
  </div>

  <div class="card" id="card" role="region" aria-live="polite"></div>

  <div class="controls">
    <button class="nav" id="prev">&larr; Back</button>
    <div class="track"><i id="fill"></i></div>
    <button class="nav primary" id="next">Next &rarr;</button>
  </div>

  <p class="foot">Arrow keys work too &nbsp;<kbd>&larr;</kbd> <kbd>&rarr;</kbd> &nbsp;&middot;&nbsp; <a href="../">back to the shelf</a></p>
</div>

<script>

/* ── figures ─────────────────────────────────── */

<text x="166" y="78" text-anchor="end" class="lab"><tspan class="k">The room,</tspan> and the</text>
<text x="166" y="94" text-anchor="end" class="lab">party you host in it</text>
<text x="166" y="180" text-anchor="end" class="lab"><tspan class="k">Who must come,</tspan></text>

const FIG_WHEEL = `<figure class="fig"><svg viewBox="0 0 620 260" role="img" aria-label="The reputation wheel, and what a level 3 reputation unlocks">

const POINTS = [
{
  bell:"The Idea", tag:"The Big Picture", title:"You just inherited a mansion. It is a disaster.",
  html:`<p>It is Victorian England, the 1890s, and you are now in charge of a huge country house in Derbyshire. Sounds great. It is not. <b>The money is gone, half the rooms are shut up, and the neighbours gossip about your family at every dinner party.</b></p>
  <p>Over about 16 turns you will fix up rooms, throw parties in them, and claw your way back up the social ladder. Think of it as a home-renovation game where the renovations exist so you can <span class="hl">show off</span>.</p>
  <p>At the end, everyone counts victory points. Most points wins. Every single rule after this one is just detail hanging off that sentence.</p>`,
  aside:{lab:"Why it is called Obsession", txt:"Your family has two grown children, and the whole county is obsessed with who they will marry. Marrying up is the ultimate flex, and the game is built around it."}
},
{
  bell:"Reputation", tag:"The Big Picture", title:"Reputation is the velvet rope.",
  html:`<p>The dial on your player board is <b>reputation</b>, and it is the most important number you own. It has two parts: a big <b>level</b> (1, 2, 3... up to Max) and a little marker orbiting it in fives.</p>
  <p>Gain five little pips and your level ticks up one. Here is the part people get wrong: <span class="hl">only the big level counts.</span> The pips are just progress toward the next level, like an XP bar.</p>
  ${FIG_WHEEL}
  <p>Reputation is a bouncer at a club. Every fancy room and every fancy guest has a <b>prestige number</b>, and if your level is lower than that number, you are not getting in.</p>`,
  aside:{lab:"Remember this", txt:"Reputation is not just points at the end. It is permission. Early reputation snowballs, because it lets you use better rooms, which give you more reputation."}
},
{
  bell:"The Trio", tag:"The Big Picture", title:"Every party needs three things. Always three.",
  html:`<p>If you learn nothing else today, learn this shape. To host anything, you need:</p>
  ${FIG_TRIO}
  <p>Missing any one of the three and the party simply does not happen. You can own the grandest ballroom in Derbyshire, but if your footman is asleep, nobody is coming.</p>
  <p>Almost every hard decision in this game is really the question: <span class="hl">do my rooms, my cards, and my staff line up this turn?</span></p>`,
  aside:{lab:"The classic beginner mistake", txt:"Buying beautiful rooms you cannot staff. A gorgeous tile you can never use is worth less than a plain one you use six times."}
},
{
  bell:"Tiles", tag:"The Pieces", title:"Tiles are rooms. Learn to read one.",
  html:`<p>You start with five: <b>Private Study, Butler&rsquo;s Room, Main Gazebo, Front Parlour, and Bowling Green.</b> They sit in your tableau, sorted into columns by category.</p>
  <p>Every tile is a tiny instruction manual. Here is one, taken apart:</p>
  ${FIG_TILE}
  <p>Read the middle first, left side then right side. That is the deal being offered: <span class="hl">supply these people, receive this stuff.</span> If there is no white activity text, the room throws no parties at all and is just a quiet perk.</p>`,
  aside:{lab:"Try this", txt:"Pick up any tile and say it out loud as a sentence. 'I need one lady and a footman, and I get 200 pounds and a reputation.' Once you can do that, tiles stop being scary."}
},
{
  bell:"Guests", tag:"The Pieces", title:"Gentry cards are the people you invite.",
  html:`<p>Your hand holds <b>gentry cards</b>. Four of them are your own family, and family can attend absolutely anything no matter how low your reputation is. The rest are visitors.</p>
  <ul class="pts">
    <li><b>Casual guests</b> carry one fleur-de-lis. Ordinary neighbours, prestige 1 or 2.</li>
    <li><b>Prestige guests</b> carry two fleur-de-lis. The genuinely important people, prestige 3 to 6, worth real points.</li>
  </ul>
  ${FIG_CARD}
  <p>Note the bottom left corner. <span class="hl">Guests need their own servants</span> on top of whatever the room already demanded. A duchess does not carry her own coat.</p>`,
  aside:{lab:"Nice detail", txt:"There are 15 starting guests, 35 casual, and 25 prestige. Your hand starts tiny and grows all game, so this is secretly a deck-building game in a corset."}
},
{
  bell:"Servants", tag:"The Pieces", title:"Servants are your engine, and they get tired.",
  html:`<p>You begin with five: a <b>Butler, Housekeeper, Valet, Lady&rsquo;s Maid, and Footman.</b> They live in three boxes on your board, and they move in a loop.</p>
  ${FIG_LOOP}
  <p>At the start of your turn everyone shuffles one box forward. Plan your parties around who is standing in that first box, because they are the only ones who can work today.</p>`,
  aside:{lab:"Remember this", txt:"Servants are also 2 victory points each at the end. Hiring more is never wasted, even if you barely use them."}
},
{
  bell:"Turn Shape", tag:"Your Turn", title:"A turn has a rhythm. Eight beats.",
  html:`<p>Do not memorise this. Just learn the shape, and the board will remind you of the rest.</p>
  <ul class="pts">
    <li><b>1. Rotate</b> your servants one box forward.</li>
    <li><b>2. Collect</b> anything the round track or your monuments owe you.</li>
    <li><b>3. Host</b> one activity by sliding a tile out.</li>
    <li><b>4. Invite</b> the guests that tile demands.</li>
    <li><b>5. Serve</b> by staffing the tile and every guest.</li>
    <li><b>6. Enjoy</b> your favours: money, reputation, new cards.</li>
    <li><b>7. Shop</b> at the Builders&rsquo; Market.</li>
    <li><b>8. Clear</b> the board and pass play to the left.</li>
  </ul>
  <p>Steps 3, 4 and 5 are one single decision made in three parts. You are really asking: <span class="hl">which party can I actually pull off right now?</span></p>`,
  aside:{lab:"Or pass", txt:"Instead of all this, you may simply pass. That sounds weak. It is not, and point 15 explains why."}
},
{
  bell:"Host", tag:"Your Turn", title:"Step one: pick your room and announce it.",
  html:`<p>Choose <b>one</b> tile from your tableau that has white activity text, and slide it into the Activity space on your board. That is the party you are throwing.</p>
  <p>The only gate here is prestige. Your reputation level must be <b>equal to or higher</b> than the number in the wreath at the bottom left.</p>
  <p>Then say it out loud. Announce the activity to the table, because <span class="hl">there are no secrets in Derbyshire society.</span> Everyone gets to watch what you are up to, and half the fun is the table reacting to it.</p>`,
  aside:{lab:"One room per turn", txt:"You may own a dozen rooms. You still host exactly one activity per turn. Owning more rooms is about having the right option available, not doing more at once."}
},
{
  bell:"Invite", tag:"Your Turn", title:"Step two: invite exactly who is asked for.",
  html:`<p>The tile tells you the guest list, and it is not a suggestion. It might demand two ladies, or one gentleman, or three gentry of any sort. <b>You must play all of them, exactly as specified, or the party is off.</b></p>
  <p>Each guest also has to clear the velvet rope: your reputation level must reach that card&rsquo;s prestige number too.</p>
  <p>Two happy exceptions. Your <b>family members</b> and the <b>Fairchild</b> cards ignore prestige entirely. They will show up to anything, which makes them a brilliant way to fill a seat you otherwise could not.</p>`,
  aside:{lab:"Watch for this", txt:"A tile you can afford with a guest you cannot invite is a dead turn. Check the whole guest list before you commit to the room."}
},
{
  bell:"Serve", tag:"Your Turn", title:"Step three: staff it. This is the tricky bit.",
  html:`<p>Now pull servants out of Available Service and place them where they are demanded: <b>on the tile, and on every single guest card that asks for one.</b> A room needing a butler plus two guests needing a valet and a lady&rsquo;s maid costs you three servants this turn.</p>
  <p>If you cannot cover it, the party does not happen. But the game gives you understudies:</p>
  <ul class="pts">
    <li>No Lady&rsquo;s Maid? A <b>Housekeeper</b> can substitute.</li>
    <li>An <b>Underbutler</b> can stand in for a Butler, Valet, or Footman.</li>
    <li>Own the Brushing Room? A <b>Footman</b> can cover for a missing Valet.</li>
  </ul>
  <p><span class="hl">Service is never optional.</span> If an icon is showing, someone is working.</p>`,
  aside:{lab:"Remember this", txt:"Count your servants before you pick your room, not after. Plan backwards from who is awake."}
},
{
  bell:"Favours", tag:"Your Turn", title:"Step four: collect the good stuff.",
  html:`<p>This is payday. Add up every reward icon on the tile <b>and</b> on the guests who attended:</p>
  <ul class="pts">
    <li><b>Money</b> &mdash; silver is 100 pounds, gold is 500.</li>
    <li><b>Reputation</b> &mdash; every lion rampant, that little lion rearing up on one leg, is one pip.</li>
    <li><b>New guests</b> &mdash; one fleur-de-lis draws a casual guest, two draws a prestige guest, straight into your hand.</li>
    <li><b>Dismiss</b> &mdash; a fleur-de-lis with a bin lets you throw a guest away. This one is optional.</li>
    <li><b>Victory point cards, gossip attacks, and hiring</b> also show up here.</li>
  </ul>
  <p>Everything except dismissing is <b>mandatory</b>. You take it whether you wanted it or not.</p>`,
  aside:{lab:"Sneaky bonus", txt:"Your young lady gains reputation whenever she attends an activity alongside a prestige male guest. Put her to work."}
},
{
  bell:"Cads", tag:"Your Turn", title:"Some guests are actively terrible.",
  html:`<p>Not everyone in your hand is a friend. The game hides traps in the guest deck, and they are wonderfully mean.</p>
  <ul class="pts">
    <li><b>Paupers</b> cost you money instead of paying you. If a party ends up net negative, you still have to pay for it.</li>
    <li><b>Cads</b> knock your reputation down when invited.</li>
    <li><b>Dead weight</b> is worth negative victory points, as bad as minus four, if it is still sitting in your cards at the end.</li>
  </ul>
  <p>So those little <b>dismiss</b> favours are not filler. They are your rubbish chute. <span class="hl">Getting rid of a minus-three guest is worth as much as scoring three points.</span></p>`,
  aside:{lab:"Tempting trap", txt:"Cads often carry juicy favours. Sometimes taking the reputation hit is correct. Just make it a choice, not an accident."}
},
{
  bell:"Market", tag:"Your Turn", title:"Step five: shop at the Builders' Market.",
  html:`<p>After the party, you may buy <b>one</b> tile from the Builders&rsquo; Market on the Derbyshire board. Pay the price of its slot, adjusted by any modifier printed in its top right corner.</p>
  <p>Two rules to remember: <b>you can never buy a second copy of a tile you already own</b>, and new tiles always arrive front side up, which is usually the weaker side.</p>
  <p>Once everyone is done, tiles slide left and the empty spaces refill. So <span class="hl">the market gets cheaper the longer a tile sits there.</span> Sometimes the smart play is waiting one turn for the thing you want to slide into a cheaper slot.</p>`,
  aside:{lab:"Later in the game", txt:"After the first courtship a Service tile reserve opens up, and after the second a prestige-1 reserve does. Good tiles stop vanishing forever, which quietly rewards patience."}
},
{
  bell:"Cleanup", tag:"Your Turn", title:"Step six: tidy up, and flip the tile.",
  html:`<p>Send every servant you used to <b>Expended Service</b>. Put the guests who attended into your <b>face-up discard pile</b>. Then return the tile home, and check its back:</p>
  <ul class="pts">
    <li><b>Black rose</b> &mdash; flip it once, permanently. The far side is the upgraded version. Your rooms literally get better by being used.</li>
    <li><b>White flower</b> &mdash; a hybrid. It flips every single time, and switches category as it goes.</li>
    <li><b>No symbol</b> &mdash; both sides are identical. Nothing to do.</li>
  </ul>
  <p>That rose flip is one of the loveliest bits of the design. <span class="hl">Using a room is how you renovate it.</span></p>`,
  aside:{lab:"Category matters", txt:"Hybrid tiles changing category is a big deal, because categories are exactly what the courtships score. See point 18."}
},
{
  bell:"Passing", tag:"Your Turn", title:"Passing is a power move, not a surrender.",
  html:`<p>Instead of hosting, you may pass. Here is what that actually gets you:</p>
  <ul class="pts">
    <li><b>Every servant</b> goes straight back to Available Service, no matter which box they were in.</li>
    <li><b>Your whole discard pile</b> comes back into your hand.</li>
    <li>You take <b>200 pounds</b>, or refresh the entire Builders&rsquo; Market for free.</li>
    <li>And you may <b>still buy a tile</b>.</li>
  </ul>
  <p>That is a full reload of your staff and your deck. <span class="hl">Passing is the deep breath between two enormous parties.</span></p>`,
  aside:{lab:"The timing question", txt:"Good players pass while they still have options. Bad players pass because they ran out. Pass one turn early, not one turn late."}
},
{
  bell:"Shortcuts", tag:"Your Turn", title:"You can always sell your good name.",
  html:`<p>Stuck mid-turn? At any point during your turn you may take these, as often as you like:</p>
  <ul class="pts">
    <li>Take <b>100 pounds</b> for 2 pips of reputation.</li>
    <li><b>Wake one servant up</b> for 3 pips of reputation.</li>
    <li><b>Refresh the Builders&rsquo; Market</b> for 4 pips, once per turn.</li>
  </ul>
  <p>Think of it as the family quietly borrowing against its own name. It works, it is never repaid, and the county notices.</p>
  <p>One hard limit: <span class="hl">you can never drop below reputation level 1.</span> If a shortcut would take you under, you simply may not do it.</p>`,
  aside:{lab:"Fair play", txt:"You should only refresh the market to find something you want, never just to wreck the tile another player was saving up for. It is written into the rules as an actual rule."}
},
{
  bell:"Seasons", tag:"The Seasons", title:"The game is four seasons, not sixteen turns.",
  html:`<p>The white pawn walks along the round track. Purple spaces are ordinary rounds. Every so often you hit a <b>green space: a courtship</b>, which ends the season. Four seasons, then the game is over.</p>
  <p>At the start of each season you flip a <b>theme card</b>, and it shows one of the five tile categories. Write it on your forehead. <span class="hl">That category is the exam topic for this season.</span></p>
  <p>Theme cards stay face up all game, so by the end you can see all four. This matters enormously in the final scoring.</p>`,
  aside:{lab:"Strategy unlocked", txt:"The theme is revealed at the start of the season, so you get several turns to buy tiles in that category before it is graded. That is the pivot the whole game turns on."}
},
{
  bell:"Courtship", tag:"The Seasons", title:"Courtships: the whole point of the obsession.",
  html:`<p>When you land on a green space, everyone adds up the victory points printed on their tiles <b>in the current theme category only</b>. Highest total wins the courtship.</p>
  <ul class="pts">
    <li>The sole winner takes a <b>Fairchild card</b> into their hand for the coming season, and draws a victory point card.</li>
    <li>If two players tie, <b>nobody</b> gets the Fairchild. Ties are punished, not shared.</li>
  </ul>
  <p>The Fairchilds are the most eligible pair in the county. They ignore prestige, so they can attend absolutely anything, and they are worth 8 points if you are holding one at the end.</p>
  <p>The <b>final courtship</b> is different: add up your tiles across <span class="hl">all four themes at once.</span> That is the big one.</p>`,
  aside:{lab:"Remember this", txt:"Tile victory points do double duty. They score at the end, and they decide courtships along the way. A high-VP tile in a themed category is worth far more than the number suggests."}
},
{
  bell:"Big Days", tag:"The Seasons", title:"The round track has fireworks on it.",
  html:`<p>Scattered along the track are special rounds, and they are where the game gets loud:</p>
  <ul class="pts">
    <li><b>National Holiday</b> &mdash; every prestige restriction is switched off for one round. Host a party miles above your station, invite people who would never speak to you, and rake in favours. This is the best turn in the game. Plan for it.</li>
    <li><b>Builders&rsquo; Holiday</b> &mdash; buy as many tiles as you can afford, not just one.</li>
    <li><b>Village Fair</b> &mdash; if your Private Study is flipped, collect 2 reputation and 300 pounds.</li>
    <li><b>Objective rounds</b> &mdash; everyone draws two objective cards.</li>
  </ul>
  <p><span class="hl">Look at the track on turn one</span> and note where the National Holiday sits. Save your best unreachable room for it.</p>`,
  aside:{lab:"Grand Ball", txt:"In some setups round six is a Grand Ball: before your turn you look at three prestige guests and keep one. A free shot at the best cards in the game."}
},
{
  bell:"Objectives", tag:"The Seasons", title:"Objective cards are your secret homework.",
  html:`<p>You are dealt five objective cards at setup, and you draw more on objective rounds. Each one describes a condition, like collecting a certain number of guests or a certain kind of tile, and pays victory points at the end if you managed it.</p>
  <p>Here is the clever bit. At <b>every courtship you must discard one</b> objective card. So the pile in front of you keeps shrinking toward the goals you are actually hitting.</p>
  <p><span class="hl">Do not warp your whole game around them.</span> Read them early, keep the two or three that match what you were doing anyway, and let the rest go.</p>`,
  aside:{lab:"Also in your pocket", txt:"Victory point cards are different. You can hold one for its end-game points, or play it any time for its immediate effect. Choosing which is a genuine dilemma."}
},
{
  bell:"Scoring", tag:"Winning", title:"Final scoring: everything you touched counts.",
  html:`<p>When the pawn reaches the wedding bells, add up:</p>
  <ul class="pts">
    <li>Victory points on all your <b>tiles</b>.</li>
    <li>Victory points on all your <b>gentry cards</b>, including the negative ones. Ouch.</li>
    <li>Each <b>objective</b> you completed.</li>
    <li><b>2 points per servant</b>, whoever they are.</li>
    <li><b>1 point per 200 pounds</b>, rounded down.</li>
    <li>Any <b>victory point cards</b> you held back.</li>
    <li>And your <b>reputation</b>, on this beautifully steep curve:</li>
  </ul>
  ${FIG_SCORE}
  <p>Look at that shape. Going from level 5 to 6 is worth <span class="hl">six whole points</span>. Reputation is never a side quest.</p>`,
  aside:{lab:"Tiebreaker", txt:"A tie goes to whoever holds a Fairchild card. Still tied? Highest reputation. Still tied after that, you genuinely share the win."}
},
{
  bell:"Tactics", tag:"Winning", title:"Five things to do in your first game.",
  html:`<p>You know the rules now. Here is how not to lose by fifty points.</p>
  <ul class="pts">
    <li><b>Chase reputation early.</b> It is permission and it is points, and it compounds. Level 2 by the end of season one is a decent target.</li>
    <li><b>Plan backwards from your servants.</b> Ask who is awake, then pick the party. Never the other way round.</li>
    <li><b>Buy tiles in this season&rsquo;s theme.</b> A courtship win hands you a Fairchild, and a Fairchild solves your hardest guest problems all season.</li>
    <li><b>Take every dismiss favour you can.</b> Rotten guests quietly cost more than most people notice.</li>
    <li><b>Pass on purpose.</b> Reload your staff and your hand before you are desperate, then follow it with your biggest party.</li>

const rail=document.getElementById('rail'),card=document.getElementById('card'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      fill=document.getElementById('fill');
let i=0;

POINTS.forEach((p,n)=>{
  const b=document.createElement('button');
  b.className='bell'; b.type='button'; b.setAttribute('role','tab');
  b.innerHTML=BELL+'<span>'+p.bell+'</span>';
  b.title=(n+1)+'. '+p.title;
  b.addEventListener('click',()=>go(n));
  rail.appendChild(b);
});

function go(n){
  i=Math.max(0,Math.min(POINTS.length-1,n));
  const p=POINTS[i];
  card.innerHTML=
    '<div class="meta"><span class="count">Point '+(i+1)+' of '+POINTS.length+'</span>'+
    '<span class="tag">'+p.tag+'</span></div>'+
    '<h2>'+p.title+'</h2>'+p.html+
    (p.aside?'<div class="aside"><span class="lab">'+p.aside.lab+'</span><p>'+p.aside.txt+'</p></div>':'');
  card.classList.remove('turning'); void card.offsetWidth; card.classList.add('turning');

  [...rail.children].forEach((b,n2)=>{
    b.classList.toggle('on',n2===i);
    b.classList.toggle('done',n2<i);
    b.setAttribute('aria-selected',n2===i);
  });
  rail.children[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});

  prev.disabled=i===0;
  next.disabled=i===POINTS.length-1;
  next.textContent=i===POINTS.length-1?'That is all of it':'Next →';
  fill.style.width=((i+1)/POINTS.length*100)+'%';
}

prev.addEventListener('click',()=>go(i-1));
next.addEventListener('click',()=>go(i+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(i+1);
  if(e.key==='ArrowLeft')go(i-1);
});
go(0);
</script>
